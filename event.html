<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event · Chang Heng Wei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <!-- Light on the first visit; a saved dark choice still wins. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("chw-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-fx" aria-hidden="true"></div>

  <!-- Top-right controls: music and theme -->
  <div class="top-controls">
    <button class="music-toggle" id="music-toggle" type="button" aria-pressed="true" aria-label="Music on. Click to turn off" title="Turn music off">
      <svg class="mt-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.4 8.8a4.6 4.6 0 0 1 0 6.4"/><path d="M18.3 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="mt-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>

    <button class="theme-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode off. Click to switch to dark mode" title="Switch to dark mode">
      <svg class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>
      <svg class="tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a6.8 6.8 0 0 0 11.1 11.1z"/></svg>
    </button>
  </div>

  <nav class="nav" aria-label="Primary">
    <div class="nav-links">
      <a data-anchor="projects">Projects</a>
      <a data-anchor="events">Events</a>
      <a data-anchor="certificates">Certificates</a>
      <a data-anchor="contact">Contact</a>
    </div>
  </nav>

  <main class="wrap detail-hero" id="event-detail"><!-- rendered by app.js --></main>

  <footer>
    <div class="wrap foot">
      <div>
        <div class="brand" style="margin-bottom:8px">Chang Heng Wei</div>
        <small>© <span id="year">2026</span> Chang Heng Wei. Built with vanilla HTML/CSS/JS.</small>
      </div>
      <div style="display:flex;gap:18px;flex-wrap:wrap">
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#certificates">Certificates</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
  </footer>

  <!-- Background music. Loops quietly; the button above turns it on and off. -->
  <audio id="bg-music" src="assets/audio/background-music.mp3" loop preload="auto"></audio>

  <script src="assets/js/data/projects.js"></script>
  <script src="assets/js/data/events.js"></script>
  <script src="assets/js/data/certificates.js"></script>
  <script src="assets/js/app.js"></script>
  <!-- No smooth-scroll library loaded. -->
</body>
</html>
